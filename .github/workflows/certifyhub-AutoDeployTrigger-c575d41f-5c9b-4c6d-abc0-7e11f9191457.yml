name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CERTIFYHUB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CERTIFYHUB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CERTIFYHUB_AZURE_SUBSCRIPTION_ID }}

      - name: Configure Registry and Update Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az extension add --name containerapp --upgrade --yes

            az containerapp registry set \
              --name certifyhub \
              --resource-group rg-certifyhub \
              --server ghcr.io \
              --username ${{ github.actor }} \
              --password ${{ secrets.GITHUB_TOKEN }}

            az containerapp ingress enable \
              --name certifyhub \
              --resource-group rg-certifyhub \
              --type external \
              --target-port 8080 \
              --transport auto

            az containerapp update \
              --name certifyhub \
              --resource-group rg-certifyhub \
              --image ${{ env.IMAGE_NAME }}:latest
